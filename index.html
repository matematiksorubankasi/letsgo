<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MATEMATİK SORU BANKASI</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    overflow: hidden;
    background: #000;
    color: #00ff41;
    font-family: "Courier New", monospace;
}

/* =========================
   MATRIX
========================= */

#matrix {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

/* =========================
   ANA EKRAN
========================= */

.main-screen {
    position: fixed;
    inset: 0;
    z-index: 5;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;

    background:
        radial-gradient(
            circle,
            rgba(255,0,0,.15),
            transparent 55%
        ),
        rgba(0,0,0,.35);
}

/* =========================
   HACKED YAZISI
========================= */

.main-warning {
    color: red;

    font-size:
        clamp(35px, 7vw, 90px);

    font-weight: 900;

    text-shadow:
        0 0 5px red,
        0 0 15px red,
        0 0 30px red,
        0 0 60px red;

    animation: mainGlitch .12s infinite;
}

.subtitle {
    margin-top: 15px;

    color: white;

    font-size:
        clamp(15px, 2vw, 25px);

    animation: blink .5s infinite;
}

/* =========================
   TERMINAL
========================= */

.terminal {
    width: min(850px, 90vw);
    height: 240px;

    margin-top: 30px;
    padding: 20px;

    border: 1px solid #00ff41;

    background: rgba(0,0,0,.85);

    box-shadow:
        0 0 15px #00ff41,
        inset 0 0 30px rgba(0,255,65,.08);

    text-align: left;
    overflow: hidden;
}

.terminal-line {
    margin: 4px 0;

    font-size:
        clamp(11px, 1.5vw, 15px);

    color: #00ff41;

    text-shadow:
        0 0 5px #00ff41;
}

/* =========================
   RASTGELE UYARILAR
========================= */

.random-warning {
    position: fixed;
    z-index: 50;

    pointer-events: none;

    font-weight: 900;
    white-space: nowrap;

    text-shadow:
        0 0 5px currentColor,
        0 0 15px currentColor,
        0 0 30px currentColor;

    animation: randomGlitch .15s infinite;
}

/* =========================
   TELEFON ÇÖKTÜ
========================= */

.phone-error {
    position: fixed;
    z-index: 100;

    left: 50%;
    top: 50%;

    width: min(550px, 88vw);

    padding: 35px;

    transform:
        translate(-50%, -50%)
        scale(0);

    opacity: 0;

    background: #090909;

    border: 3px solid red;

    box-shadow:
        0 0 20px red,
        0 0 60px red;

    text-align: center;

    transition: .5s ease;
}

.phone-error.show {
    transform:
        translate(-50%, -50%)
        scale(1);

    opacity: 1;
}

.phone-error h1 {
    color: red;

    font-size:
        clamp(25px, 5vw, 50px);

    margin-top: 0;

    text-shadow: 0 0 15px red;

    animation: blink .35s infinite;
}

.phone-error p {
    color: white;
    font-size: 17px;
}

/* =========================
   SAHTE BUTON
========================= */

.fake-button {
    padding: 13px 28px;
    margin-top: 15px;

    border: 2px solid white;

    background: red;
    color: white;

    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 0 20px red;

    transition: .2s;
}

.fake-button:hover {
    transform: scale(1.1);
}

/* =========================
   SON ŞAKA
========================= */

.prank {
    position: fixed;
    inset: 0;

    z-index: 200;

    display: none;

    justify-content: center;
    align-items: center;

    flex-direction: column;

    background: #000;

    text-align: center;
}

.prank h1 {
    margin: 0;

    color: #00ff41;

    font-size:
        clamp(45px, 11vw, 120px);

    text-shadow:
        0 0 10px #00ff41,
        0 0 30px #00ff41,
        0 0 60px #00ff41;

    animation: zoom 1s infinite alternate;
}

.prank p {
    color: white;

    font-size:
        clamp(16px, 3vw, 28px);
}

/* =========================
   SCANLINES
========================= */

.scanlines {
    position: fixed;
    inset: 0;

    z-index: 500;

    pointer-events: none;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.035) 0,
            rgba(255,255,255,.035) 1px,
            transparent 2px,
            transparent 4px
        );
}

/* =========================
   FLASH
========================= */

.flash {
    position: fixed;
    inset: 0;

    z-index: 400;

    pointer-events: none;

    background: red;

    opacity: 0;
}

/* =========================
   GLITCH BAR
========================= */

.glitch-bar {
    position: fixed;

    z-index: 60;

    height: 3px;

    background: red;

    pointer-events: none;

    box-shadow: 0 0 10px red;

    animation: barMove .2s linear;
}

/* =========================
   ANİMASYONLAR
========================= */

@keyframes mainGlitch {

    0% {
        transform: translate(0);
    }

    20% {
        transform: translate(-5px,2px);
    }

    40% {
        transform: translate(5px,-2px);
    }

    60% {
        transform: translate(-3px,-1px);
    }

    80% {
        transform: translate(3px,2px);
    }

    100% {
        transform: translate(0);
    }
}

@keyframes randomGlitch {

    0% {
        transform:
            translate(0,0)
            skew(0);
    }

    25% {
        transform:
            translate(-8px,3px)
            skew(10deg);
    }

    50% {
        transform:
            translate(8px,-3px)
            skew(-10deg);
    }

    75% {
        transform:
            translate(-4px,2px)
            skew(5deg);
    }

    100% {
        transform:
            translate(0,0)
            skew(0);
    }
}

@keyframes blink {

    50% {
        opacity: 0;
    }
}

@keyframes zoom {

    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.08);
    }
}

@keyframes barMove {

    from {
        transform: translateX(-100%);
        opacity: 1;
    }

    to {
        transform: translateX(100vw);
        opacity: 0;
    }
}
</style>
</head>

<body>

<!-- =================================================
     SES
================================================= -->

<audio
    id="hackerSound"
    autoplay
    loop
    preload="auto">

    <source
        src="the-timmy-troll.mp3"
        type="audio/mpeg">

</audio>


<!-- =================================================
     MATRIX
================================================= -->

<canvas id="matrix"></canvas>


<!-- =================================================
     ANA EKRAN
================================================= -->

<div class="main-screen">

    <div class="main-warning">
        ⚠ SYSTEM HACKED ⚠
    </div>

    <div class="subtitle">
        SİSTEMİNİZ ELE GEÇİRİLDİ...
    </div>

    <div class="terminal">
        <div id="terminalText"></div>
    </div>

</div>


<!-- =================================================
     TELEFON UYARISI
================================================= -->

<div
    class="phone-error"
    id="phoneError">

    <h1>
        📱 TELEFON ÇÖKTÜ!
    </h1>

    <p>
        ⚠ Yetkisiz erişim tespit edildi.
    </p>

    <p>
        Sistem dosyaları taranıyor...
    </p>

    <p>
        <b>
            %87 ŞİFRELEME TAMAMLANDI
        </b>
    </p>

    <button
        class="fake-button"
        onclick="finishPrank()">

        SİSTEMİ KURTAR

    </button>

</div>


<!-- FLASH -->

<div
    class="flash"
    id="flash">
</div>


<!-- =================================================
     ŞAKA SONU
================================================= -->

<div
    class="prank"
    id="prank">

    <h1>
        😂 ŞAKAYDI!
    </h1>

    <p>
        Telefonun hacklenmedi dostum 😎
    </p>

</div>


<div class="scanlines"></div>


<script>

/* =================================================
   SES
================================================= */

const sound =
    document.getElementById(
        "hackerSound"
    );

sound.volume = 0.7;


/*
    Sayfa açılır açılmaz
    otomatik oynatmayı deniyoruz.
*/

window.addEventListener(
    "load",
    async () => {

        try {

            await sound.play();

            console.log(
                "Ses otomatik başladı."
            );

        } catch (error) {

            console.log(
                "Tarayıcı otomatik sesi engelledi."
            );

        }

    }
);


/*
    Chrome otomatik sesi engellerse,
    kullanıcının ilk tıklamasında
    ses başlar.
*/

document.addEventListener(
    "click",
    () => {

        sound.play().catch(
            () => {}
        );

    },
    {
        once: true
    }
);


/*
    İlk klavye hareketinde de başlat.
*/

document.addEventListener(
    "keydown",
    () => {

        sound.play().catch(
            () => {}
        );

    },
    {
        once: true
    }
);


/* =================================================
   MATRIX
================================================= */

const canvas =
    document.getElementById(
        "matrix"
    );

const ctx =
    canvas.getContext("2d");


function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

resizeCanvas();


window.addEventListener(
    "resize",
    resizeCanvas
);


const characters =
"01ABCDEFGHIJKLMNOPQRSTUVWXYZアカサタナハマヤラワ";


const fontSize = 16;


let columns =
    Math.floor(
        canvas.width / fontSize
    );


let drops =
    Array(columns).fill(1);


function drawMatrix() {

    ctx.fillStyle =
        "rgba(0,0,0,.07)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.fillStyle =
        "#00ff41";

    ctx.font =
        fontSize + "px monospace";


    for (
        let i = 0;
        i < drops.length;
        i++
    ) {

        const character =
            characters[
                Math.floor(
                    Math.random()
                    * characters.length
                )
            ];


        ctx.fillText(
            character,
            i * fontSize,
            drops[i] * fontSize
        );


        if (
            drops[i] * fontSize >
            canvas.height &&
            Math.random() > .975
        ) {

            drops[i] = 0;

        }


        drops[i]++;

    }

}


setInterval(
    drawMatrix,
    35
);


/* =================================================
   TERMINAL
================================================= */

const terminal =
    document.getElementById(
        "terminalText"
    );


const messages = [

    "[SYSTEM] Bağlantı kuruluyor...",

    "[SYSTEM] IP adresi tespit edildi...",

    "[ACCESS] Güvenlik duvarı aşılıyor...",

    "[ACCESS] Yönetici erişimi elde edildi!",

    "[WARNING] Yetkisiz işlem algılandı!",

    "[SYSTEM] Dosyalar taranıyor...",

    "[SYSTEM] 847 dosya bulundu...",

    "[HACK] Şifreleme protokolü başlatılıyor...",

    "[HACK] Sistem kontrolü ele geçirildi!",

    "[WARNING] ACİL MÜDAHALE GEREKLİ!",

    "[SYSTEM] Sistem kararlılığı: %13",

    "[ERROR] Kritik sistem hatası!"

];


let messageIndex = 0;


function addTerminalMessage() {

    const line =
        document.createElement(
            "div"
        );

    line.className =
        "terminal-line";

    line.textContent =
        messages[messageIndex];


    terminal.appendChild(line);


    if (
        terminal.children.length > 9
    ) {

        terminal.removeChild(
            terminal.firstChild
        );

    }


    messageIndex++;


    if (
        messageIndex >=
        messages.length
    ) {

        messageIndex = 0;

    }

}


setInterval(
    addTerminalMessage,
    550
);


/* =================================================
   RASTGELE HACK MESAJLARI
================================================= */

const hackerMessages = [

    "⚠ HACKLENDİNİZ ⚠",

    "🚨 SİSTEM ELE GEÇİRİLDİ 🚨",

    "☠ YETKİSİZ ERİŞİM ☠",

    "⚠ TELEFONUNUZ ÇÖKTÜ ⚠",

    "💀 SYSTEM FAILURE 💀",

    "🚨 ACİL MÜDAHALE 🚨",

    "⚠ DOSYALAR TARANIYOR ⚠",

    "☠ HACKER ACCESS ☠",

    "⚠ VIRUS DETECTED ⚠",

    "🚨 SECURITY BREACH 🚨",

    "💻 ROOT ACCESS",

    "☠ SYSTEM FAILURE ☠"

];


function createRandomWarning() {

    const warning =
        document.createElement(
            "div"
        );


    warning.className =
        "random-warning";


    warning.textContent =
        hackerMessages[
            Math.floor(
                Math.random()
                * hackerMessages.length
            )
        ];


    warning.style.left =
        (
            Math.random() * 82 + 4
        ) + "%";


    warning.style.top =
        (
            Math.random() * 82 + 4
        ) + "%";


    warning.style.fontSize =
        (
            Math.random() * 25 + 18
        ) + "px";


    warning.style.color =
        Math.random() > .45
            ? "red"
            : "#00ff41";


    document.body.appendChild(
        warning
    );


    setTimeout(
        () => {

            warning.remove();

        },
        1800
    );

}


/*
    Ekranda sürekli belirsin
*/

setInterval(
    () => {

        createRandomWarning();


        if (
            Math.random() > .45
        ) {

            setTimeout(
                createRandomWarning,
                180
            );

        }


    },
    650
);


/* =================================================
   GLITCH BARLARI
================================================= */

function createGlitchBar() {

    const bar =
        document.createElement(
            "div"
        );


    bar.className =
        "glitch-bar";


    bar.style.top =
        Math.random() * 100 + "%";


    bar.style.width =
        Math.random() * 50 + 10 + "%";


    document.body.appendChild(
        bar
    );


    setTimeout(
        () => {

            bar.remove();

        },
        250
    );

}


setInterval(
    createGlitchBar,
    500
);


/* =================================================
   KIRMIZI FLASH
================================================= */

const flash =
    document.getElementById(
        "flash"
    );


setInterval(
    () => {

        flash.style.opacity =
            ".12";


        setTimeout(
            () => {

                flash.style.opacity =
                    "0";

            },
            100
        );

    },
    2800
);


/* =================================================
   TELEFON ÇÖKTÜ
================================================= */

const phoneError =
    document.getElementById(
        "phoneError"
    );


setTimeout(
    () => {

        phoneError.classList.add(
            "show"
        );

    },
    7000
);


/* =================================================
   SAHTE KURTARMA
================================================= */

function finishPrank() {

    phoneError.classList.remove(
        "show"
    );


    setTimeout(
        () => {

            document.getElementById(
                "prank"
            ).style.display =
                "flex";

        },
        600
    );

}

</script>

</body>
</html>
